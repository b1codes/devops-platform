# Reusable workflow: terraform-plan-cost.yml
#
# Runs `terraform plan` against a given working directory, then posts an
# Infracost cost estimate as a PR comment.
#
# FORK SAFETY NOTE: This workflow intentionally skips execution on pull requests
# opened from forks (via the `if:` guard at the job level). Forks cannot access
# repository secrets, so running on fork PRs would either fail with an unhelpful
# "secret not found" error or, in misconfigured repos, silently expose secrets to
# untrusted actors. The guard `github.event.pull_request.head.repo.full_name ==
# github.repository` ensures only PRs from the same repo (i.e. branches) run the
# job. Fork contributors will see the job as "skipped", which is intentional.
#
# Usage: call this workflow with `uses:` from a consumer repo:
#   jobs:
#     plan:
#       uses: B1Codes/devops-platform/.github/workflows/terraform-plan-cost.yml@v0.1.0
#       with:
#         working_directory: infra/
#         aws_region: us-east-1
#       secrets:
#         role_to_assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
#         infracost_api_key: ${{ secrets.INFRACOST_API_KEY }}

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path to the directory containing the Terraform root module."
        required: true
        type: string
      tf_version:
        description: "Terraform version to install."
        required: false
        type: string
        default: "1.9.5"
      aws_region:
        description: "AWS region used for provider authentication."
        required: true
        type: string
      infracost_breakdown_path:
        description: "Output path for the Infracost JSON breakdown file."
        required: false
        type: string
        default: "./infracost-base.json"
    secrets:
      role_to_assume:
        description: "ARN of the IAM role to assume via OIDC for AWS authentication."
        required: true
      infracost_api_key:
        description: "Infracost API key for cost estimation."
        required: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Terraform plan + Infracost estimate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip forks: they can't access secrets and the job would fail with a
    # confusing error. See the fork safety note in the header comment.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.1
        with:
          terraform_version: ${{ inputs.tf_version }}
          # Disable the Terraform wrapper so that raw output can be captured
          # by subsequent steps (avoids "Error: Process completed with exit code 1"
          # on stdout-capturing commands).
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Terraform init
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false

      - name: Terraform validate
        shell: bash
        run: |
          set -euo pipefail
          terraform validate

      - name: Terraform plan
        shell: bash
        run: |
          set -euo pipefail
          terraform plan -input=false -out=tfplan.binary

      - name: Convert plan to JSON
        shell: bash
        run: |
          set -euo pipefail
          terraform show -json tfplan.binary > tfplan.json

      - name: Set up Infracost
        uses: infracost/actions/setup@9e37f97fd6e3c8d4ce30d83b18e94a358da94c2a # v3.0.0
        with:
          api-key: ${{ secrets.infracost_api_key }}

      - name: Run Infracost breakdown
        env:
          INFRACOST_OUTPUT_PATH: ${{ inputs.infracost_breakdown_path }}
        shell: bash
        run: |
          set -euo pipefail
          infracost breakdown \
            --path tfplan.json \
            --format json \
            --out-file "${INFRACOST_OUTPUT_PATH}"

      - name: Post Infracost comment on PR
        env:
          INFRACOST_OUTPUT_PATH: ${{ inputs.infracost_breakdown_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          # --behavior update: edit an existing Infracost comment rather than
          # posting a new one each run, keeping PR threads clean.
          infracost comment github \
            --path "${INFRACOST_OUTPUT_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pull-request "${PR_NUMBER}" \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --behavior update
